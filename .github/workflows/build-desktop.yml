name: Build Desktop Client

on:
  push:
    branches: [main, integrate/upstream]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Desktop Linux amd64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with: { clean: true, fetch-depth: 1 }

      - name: Clone minirtc + install deps
        run: |
          git clone --depth=1 https://github.com/kunkundi/minirtc.git submodules/minirtc
          sudo apt-get update -qq && sudo apt-get install -y -qq \
            g++ build-essential cmake pkg-config git curl \
            libpulse-dev libasound2-dev libx11-dev libxtst-dev libxrandr-dev libxfixes-dev \
            libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libxkbcommon-dev 2>&1 | tail -2
          curl -fsSL https://xmake.io/shget.text | bash && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: xmake build + package
        run: |
          xmake f -a x86_64 -m release --CROSSDESK_VERSION="${GITHUB_SHA:0:7}" -y
          xmake b -vy crossdesk 2>&1 | tail -30
          mkdir -p dist && cp build/linux/x86_64/release/crossdesk dist/ && strip dist/crossdesk || true
          cd dist && tar -czf crossdesk-linux-amd64.tar.gz crossdesk && ls -lh crossdesk-linux-amd64.tar.gz

      - uses: actions/upload-artifact@v4
        with: { name: desktop-linux-amd64, path: dist/crossdesk-linux-amd64.tar.gz }

  build-windows:
    name: Desktop Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with: { clean: true, fetch-depth: 1 }

      - name: Clone minirtc + xmake + MSVC build
        shell: pwsh
        run: |
          git clone --depth=1 https://github.com/kunkundi/minirtc.git submodules/minirtc
          Invoke-Expression (Invoke-Webrequest 'https://raw.githubusercontent.com/tboox/xmake/master/scripts/get.ps1' -UseBasicParsing).Content
          echo "C:\Users\runneradmin\xmake" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          & "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 2>&1 | Out-Null
          $vsDir = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools"
          $msvc  = (Get-ChildItem "$vsDir\VC\Tools\MSVC" | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          $sdkI  = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $sdkL  = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib"   | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $sdkB  = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin"    | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\x64"
          $env:PATH    = "$msvc\bin\Hostx64\x64;$sdkB;C:\Users\runneradmin\xmake;" + $env:PATH
          $env:INCLUDE = "$msvc\include;$sdkI\ucrt;$sdkI\shared;$sdkI\um;$sdkI\winrt"
          $env:LIB     = "$msvc\lib\x64;$sdkL\ucrt\x64;$sdkL\um\x64"

          xmake f -a x86_64 -m release --CROSSDESK_VERSION="$($env:GITHUB_SHA.Substring(0,7))" -y
          xmake b -vy crossdesk 2>&1 | Select-Object -Last 40

          $exe = Get-ChildItem -Path build -Filter crossdesk.exe -Recurse | Select-Object -First 1
          if (-not $exe) { Write-Host "ERROR: crossdesk.exe not found!"; exit 1 }
          mkdir -p dist && Copy-Item $exe.FullName dist/crossdesk.exe
          Compress-Archive dist/crossdesk.exe dist/crossdesk-win-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with: { name: desktop-windows-x64, path: dist/crossdesk-win-x64.zip }
