name: Build Mobile

on:
  push:
    branches: [main, integrate/upstream]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK (arm64 + x86_64)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v5
        with: { clean: true, fetch-depth: 1 }

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -30
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk dist/cyandesk-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-x86_64-release-unsigned.apk dist/cyandesk-x86_64.apk
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with: { name: android-apks, path: mobile/android/dist/*.apk }
