name: Build Mobile (Android + iOS)

on:
  push:
    branches: [main, integrate/upstream]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK (arm64 + x86_64)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -30

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk dist/cyandesk-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-x86_64-release-unsigned.apk dist/cyandesk-x86_64.apk
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: mobile/android/dist/*.apk

  build-ios:
    name: iOS (compile check, no signing)
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile/ios/apps/ios
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Verify iOS source
        run: |
          ls -la CrossDeskMobile/ 2>&1 | head -5
          xcodebuild -version

      - name: Swift compile check (no signing)
        continue-on-error: true
        run: |
          xcodebuild \
            -project CrossDeskMobile.xcodeproj \
            -scheme CrossDeskMobile \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -40
