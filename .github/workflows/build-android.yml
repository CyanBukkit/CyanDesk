name: Build Android APK

on:
  push:
    branches: [main, integrate/upstream]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Android APK (arm64 + x86_64)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Restore gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version 2>&1 | head -5

      - name: Build APK (unsigned, split ABI)
        run: |
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -40

      - name: Locate artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk dist/cyandesk-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-x86_64-release-unsigned.apk dist/cyandesk-x86_64.apk
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: android/dist/*.apk

  # ─── GitHub Release (tag v*) ────────────────────────────────────────────────
  release:
    name: Publish to GitHub Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename
        run: |
          mkdir -p release
          cp artifacts/android-apks/cyandesk-arm64-v8a.apk release/
          cp artifacts/android-apks/cyandesk-x86_64.apk release/
          ls -lh release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Android ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: release/*
          body: |
            **CyanDesk Android APK**

            Split-ABI release (no universal APK — pick your CPU arch).

            | ABI | Artifact |
            |-----|----------|
            | arm64-v8a | `cyandesk-arm64-v8a.apk` (most phones 2018+) |
            | x86_64 | `cyandesk-x86_64.apk` (emulators only) |

            **Note:** These are unsigned APK stubs — native `cyandesk.aar` (minirtc bindings) is still a stub.
            Full viewer/host functionality requires the real minirtc mobile AAR.
