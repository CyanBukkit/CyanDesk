name: Build Server

on:
  push:
    branches: [main, integrate/upstream]
    paths:
      - "server/**"
      - ".github/workflows/build-server.yml"
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-linux:
    name: Server Linux amd64
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq \
            g++ cmake git pkg-config \
            libssl-dev libasio-dev libspdlog-dev nlohmann-json3-dev \
            file 2>&1 | tail -3

      - name: Build
        run: |
          mkdir -p build
          g++ -O2 -std=c++17 -o build/signal_server \
              src/signal_server.cpp src/main.cpp \
              src/transmission_manager.cpp src/client_id_generator.cpp \
              -Ithirdparty/websocketpp/include \
              $(pkg-config --cflags --libs asio spdlog nlohmann_json openssl) \
              -lpthread
          file build/signal_server
          ldd build/signal_server | head -10

      - name: Package
        run: |
          cd build
          tar -czf signal-server-linux-amd64.tar.gz signal_server

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-amd64
          path: server/build/signal-server-linux-amd64.tar.gz

  build-windows:
    name: Server Windows x64
    runs-on: windows-2022
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Install xmake + openssl package
        shell: pwsh
        run: |
          Invoke-Expression (Invoke-Webrequest 'https://raw.githubusercontent.com/tboox/xmake/master/scripts/get.ps1' -UseBasicParsing).Content
          "C:\Users\runneradmin\xmake" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore MSVC env
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\Launch-VsDevShell.ps1" `
            -Arch amd64 -HostArch amd64 2>&1 | Out-Null
          $vsDir = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools"
          $msvcDir = (Get-ChildItem "$vsDir\VC\Tools\MSVC" | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          $sdkDir  = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $sdkLib  = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $sdkBin  = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\x64"
          $env:PATH    = "$msvcDir\bin\Hostx64\x64;$sdkBin;C:\Program Files\xmake;" + $env:PATH
          $env:INCLUDE = "$msvcDir\include;$sdkDir\ucrt;$sdkDir\shared;$sdkDir\um;$sdkDir\winrt"
          $env:LIB     = "$msvcDir\lib\x64;$sdkLib\ucrt\x64;$sdkLib\um\x64"
          echo "PATH=$($env:PATH.Substring(0, [Math]::Min(120, $env:PATH.Length)))"
          echo "cl:"; where.exe cl

      - name: Configure xmake
        shell: pwsh
        run: xmake f -a x86_64 -m release -y

      - name: Build
        shell: pwsh
        run: xmake b -v signal_server

      - name: Locate exe + verify
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter signal_server.exe -Recurse | Select-Object -First 1
          if (-not $exe) { Write-Host "ERROR: signal_server.exe not found!"; exit 1 }
          Write-Host "Found: $($exe.FullName) ($([math]::Round($exe.Length/1KB, 1)) KB)"
          Copy-Item $exe.FullName build/signal_server.exe
          & .\build\signal_server.exe 9999 2>&1 | Select-Object -First 3
          # Kill it since there's no stop

      - uses: actions/upload-artifact@v4
        with:
          name: server-windows-x64
          path: server/build/signal_server.exe

  build-macos:
    name: Server macOS arm64
    runs-on: macos-14
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Install deps
        run: |
          brew update --quiet 2>&1 | tail -1
          brew install --quiet pkg-config openssl spdlog nlohmann-json 2>&1 | tail -3

      - name: Build
        run: |
          # asio is header-only, need system path
          brew install --quiet asio 2>/dev/null || true
          ASIO_INC=$(brew --prefix asio)/include
          OPENSSL_DIR=$(brew --prefix openssl@3)
          mkdir -p build
          g++ -O2 -std=c++17 -o build/signal_server \
              src/signal_server.cpp src/main.cpp \
              src/transmission_manager.cpp src/client_id_generator.cpp \
              -Ithirdparty/websocketpp/include -I$ASIO_INC \
              -I"$OPENSSL_DIR/include" \
              -L"$OPENSSL_DIR/lib" \
              $(pkg-config --cflags --libs spdlog nlohmann-json openssl) \
              -lpthread 2>&1 | tail -10
          file build/signal_server

      - name: Package
        run: cd build && tar -czf signal-server-macos-arm64.tar.gz signal_server

      - uses: actions/upload-artifact@v4
        with:
          name: server-macos-arm64
          path: server/build/signal-server-macos-arm64.tar.gz

  # ─── GitHub Release (auto-tag) ─────────────────────────────────────────────
  release:
    name: Publish to GitHub Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename
        run: |
          mkdir -p release
          cp artifacts/server-linux-amd64/*     release/signal-server-linux-amd64.tar.gz
          cp artifacts/server-windows-x64/*    release/signal-server-windows-x64.exe
          cp artifacts/server-macos-arm64/*    release/signal-server-macos-arm64.tar.gz
          ls -lh release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Server ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: release/*
          body: |
            **Server binary release — CyanDesk / CrossDesk**

            Authenticated WebSocket signaling + HTTP device registry API.

            | Platform | Artifact |
            |----------|----------|
            | Linux amd64 | `signal-server-linux-amd64.tar.gz` |
            | Windows x64 | `signal-server-windows-x64.exe` |
            | macOS arm64 | `signal-server-macos-arm64.tar.gz` |

            **Run (all platforms):**
            ```
            SERVER_PASSWORD=changeme HTTP_API_PORT=9091 ./signal_server 9090
            ```

            See `server/.env.example` for full config.

      - name: Move latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git tag -f server-latest
          git push origin server-latest --force

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: server-latest
          name: Server Latest
          draft: false
          prerelease: false
          files: release/*
