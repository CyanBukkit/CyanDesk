name: Build Server

on:
  push:
    branches: [main, integrate/upstream]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Server Linux amd64
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            g++ cmake git pkg-config \
            libssl-dev libasio-dev libspdlog-dev nlohmann-json3-dev \
            file 2>&1 | tail -3

      - name: Build
        run: |
          mkdir -p build
          g++ -O2 -std=c++17 -o build/signal_server \
              src/signal_server.cpp src/main.cpp \
              src/transmission_manager.cpp src/client_id_generator.cpp \
              -Ithirdparty/websocketpp/include \
              $(pkg-config --cflags --libs asio spdlog nlohmann_json openssl) \
              -lpthread
          file build/signal_server

      - name: Package
        run: |
          cd build
          tar -czf signal-server-linux-amd64.tar.gz signal_server
          ls -lh signal-server-linux-amd64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-amd64
          path: server/build/signal-server-linux-amd64.tar.gz

  build-windows:
    name: Server Windows x64
    runs-on: windows-2022
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Compile + link server.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\Launch-VsDevShell.ps1" `
            -Arch amd64 -HostArch amd64 2>&1 | Out-Null
          $vsDir = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools"
          $msvcDir = (Get-ChildItem "$vsDir\VC\Tools\MSVC" | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          $sdkDir  = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $sdkLib  = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $sdkBin  = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\x64"
          $env:PATH    = "$msvcDir\bin\Hostx64\x64;$sdkBin;" + $env:PATH
          $env:INCLUDE = "$msvcDir\include;$sdkDir\ucrt;$sdkDir\shared;$sdkDir\um;$sdkDir\winrt"
          $env:LIB     = "$msvcDir\lib\x64;$sdkLib\ucrt\x64;$sdkLib\um\x64"

          # Download asio header-only if not cached
          $asioDir = "$env:TEMP\asio-1.32.0"
          if (!(Test-Path "$asioDir\asio\include")) {
            Invoke-WebRequest "https://github.com/chriskohlhoff/asio/archive/refs/tags/v1.32.0.zip" -OutFile "$env:TEMP\asio.zip"
            Expand-Archive "$env:TEMP\asio.zip" -DestinationPath "$env:TEMP" -Force
          }
          $asioSrc = "$asioDir\asio\include"

          New-Item -ItemType Directory -Force -Path build | Out-Null
          cl /O2 /std:c++17 /EHsc /MD /DASIO_STANDALONE /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0601 \
            /I"thirdparty\websocketpp\include" /I"$asioSrc" /I"src" /I"src\log" /I"src\common" \
            /Fe:"build\server.exe" \
            src\signal_server.cpp src\main.cpp src\transmission_manager.cpp src\client_id_generator.cpp \
            /link ws2_32.lib Bcrypt.lib shlwapi.lib

      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem server/build/server.exe -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Host "ERROR: server.exe not found!"; exit 1 }
          Write-Host "Found: $($exe.FullName) ($([math]::Round($exe.Length/1KB, 1)) KB)"

      - uses: actions/upload-artifact@v4
        with:
          name: server-windows-x64
          path: server/build/server.exe

  build-macos:
    name: Server macOS arm64
    runs-on: macos-14
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew update --quiet 2>&1 | tail -1
          brew install --quiet pkg-config openssl spdlog nlohmann-json asio 2>&1 | tail -3

      - name: Build
        run: |
          ASIO_INC=$(brew --prefix asio)/include
          OPENSSL_DIR=$(brew --prefix openssl@3)
          mkdir -p build
          g++ -O2 -std=c++17 -o build/signal_server \
              src/signal_server.cpp src/main.cpp \
              src/transmission_manager.cpp src/client_id_generator.cpp \
              -Ithirdparty/websocketpp/include -I$ASIO_INC \
              -I"$OPENSSL_DIR/include" -L"$OPENSSL_DIR/lib" \
              $(pkg-config --cflags --libs spdlog nlohmann-json openssl) \
              -lpthread 2>&1 | tail -20
          file build/signal_server

      - name: Package
        run: cd build && tar -czf signal-server-macos-arm64.tar.gz signal_server

      - uses: actions/upload-artifact@v4
        with:
          name: server-macos-arm64
          path: server/build/signal-server-macos-arm64.tar.gz
